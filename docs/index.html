<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>portable-text-editor-htmx — CDN smoke test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      button[type='submit'] {
        margin-top: 1rem;
        padding: 8px 16px;
        cursor: pointer;
      }
      pre {
        background: #f6f6f6;
        padding: 1rem;
        overflow-x: auto;
        font-size: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .live {
        color: #666;
        font-size: 12px;
      }
    </style>

    <!-- Pin the demo to the published editor; @main redirects can be cached. -->
    <script
      src="https://esm.sh/gh/kevinsimper/portable-text-editor-htmx@6bbf9882022dd8c801506c4be2efe91287b90e2a/public/client.js?raw"
      defer
    ></script>
  </head>
  <body>
    <h1>portable-text-editor-htmx</h1>
    <p>
      Loaded from esm.sh. Add text, images, or videos. Media blocks include
      descriptions and captions, with Edit and Remove controls. Click
      <strong>Submit</strong> to inspect the resulting Portable Text JSON.
    </p>

    <form id="demo">
      <portable-text-editor
        name="content"
        data-initial="[]"
      ></portable-text-editor>
      <button type="submit">Submit</button>
      <span class="live" id="live"></span>
    </form>

    <h2>Submitted form data</h2>
    <pre id="output">(submit the form to see the Portable Text JSON)</pre>

    <script>
      const form = document.getElementById('demo')
      const output = document.getElementById('output')
      const live = document.getElementById('live')

      form.addEventListener('submit', (e) => {
        e.preventDefault()
        const data = new FormData(form)
        const value = data.get('content')
        try {
          output.textContent = JSON.stringify(JSON.parse(value), null, 2)
        } catch {
          output.textContent = String(value)
        }
      })

      // Live preview of pte:change events (proves the event fires on every edit)
      let count = 0
      document.addEventListener('pte:change', () => {
        count++
        live.textContent = `pte:change fired ${count} time${count === 1 ? '' : 's'}`
      })
    </script>
  </body>
</html>
